# Dashboard Layout Interior - PT Citius
# Jalankan:  docker compose up -d --build
# Frontend : http://localhost:3000   (proxy /api dan /uploads ke backend, tanpa CORS)
# Backend  : http://localhost:8800   (API + SQLite, data di volume ./backend/data)
services:
  backend:
    build: ./backend
    container_name: layout-interior-backend
    environment:
      HOST: 0.0.0.0
      PORT: "8800"
      # alamat publik aplikasi (mis. https://layout.contoh.com) agar Settings menampilkan URL MCP yang benar
      PUBLIC_URL: "${PUBLIC_URL:-}"
    volumes:
      - ./backend/data:/app/data
    ports:
      - "${BACKEND_PORT:-8800}:8800"
    restart: unless-stopped

  frontend:
    build:
      context: ./dashboard-layout-interior
      args:
        # kosong = browser memanggil origin frontend; Next mem-proxy ke BACKEND_URL
        NEXT_PUBLIC_API_BASE: "${NEXT_PUBLIC_API_BASE:-}"
        BACKEND_URL: http://backend:8800
    container_name: layout-interior-frontend
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    restart: unless-stopped

  # Opsional: Cloudflare Tunnel (jalankan dengan `docker compose --profile tunnel up -d`).
  # Isi TUNNEL_TOKEN di .env dari Zero Trust > Networks > Tunnels. Public hostname tunnel diarahkan ke
  # http://frontend:3000 (satu hostname untuk aplikasi + /mcp + /api). Lihat README bagian "Cloudflare Tunnel".
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: layout-interior-tunnel
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: "${TUNNEL_TOKEN:-}"
    depends_on:
      - frontend
    profiles: ["tunnel"]
    restart: unless-stopped
